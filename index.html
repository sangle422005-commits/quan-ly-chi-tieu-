<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Chi Tiêu & Nợ</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
        body { background: #f4f6f9; color: #1f2937; }
        .container { width: 95%; max-width: 1200px; margin: 30px auto; }
        .header { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; padding: 25px; border-radius: 15px; margin-bottom: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
        .header h1 { font-size: 30px; margin-bottom: 8px; }
        .header p { opacity: 0.9; }

        /* DASHBOARD */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .card { background: white; padding: 22px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.06); }
        .card-title { font-size: 15px; color: #6b7280; margin-bottom: 10px; }
        .card-value { font-size: 27px; font-weight: bold; }
        .income { color: #16a34a; }
        .expense { color: #dc2626; }
        .balance { color: #2563eb; }

        /* MAIN GRID */
        .main-grid { display: grid; grid-template-columns: 380px 1fr; gap: 25px; }
        .section { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.06); margin-bottom: 25px; }
        .section h2 { margin-bottom: 20px; font-size: 20px; }

        /* FORM */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 7px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; font-size: 14px; }
        input:focus, select:focus { border-color: #2563eb; }
        .radio-group { display: flex; gap: 10px; }
        .radio-option { flex: 1; }
        .radio-option input { display: none; }
        .radio-option label { display: block; text-align: center; padding: 11px; border: 1px solid #d1d5db; border-radius: 8px; cursor: pointer; }
        .radio-option input:checked + label { background: #2563eb; color: white; border-color: #2563eb; }
        
        button { border: none; cursor: pointer; border-radius: 8px; padding: 12px 18px; font-size: 14px; font-weight: bold; transition: opacity 0.2s; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-add { width: 100%; background: #2563eb; color: white; }
        .btn-add:hover { background: #1d4ed8; }
        .btn-debt { background: #f59e0b; color: white; width: 100%; }
        .btn-debt:hover { background: #d97706; }

        /* TRANSACTIONS */
        .filter { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .transaction { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #e5e7eb; }
        .transaction:last-child { border-bottom: none; }
        .transaction-left { display: flex; align-items: center; gap: 12px; }
        .icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #eff6ff; font-size: 20px; flex-shrink: 0; }
        .transaction-info h3 { font-size: 15px; margin-bottom: 4px; }
        .transaction-info p { color: #6b7280; font-size: 12px; }
        .transaction-right { display: flex; align-items: center; gap: 15px; }
        .amount { font-weight: bold; white-space: nowrap; }
        .amount.expense { color: #dc2626; }
        .amount.income { color: #16a34a; }
        
        .delete-btn { background: #fee2e2; color: #dc2626; padding: 7px 10px; font-size: 12px; }
        .pay-btn { background: #dcfce7; color: #16a34a; padding: 7px 10px; font-size: 12px; }
        .empty { text-align: center; color: #9ca3af; padding: 30px; }

        /* CHART */
        .chart-container { position: relative; height: 300px; }

        @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
        @media (max-width: 650px) {
            .dashboard, .filter { grid-template-columns: 1fr; }
            .transaction-right { flex-direction: column; align-items: flex-end; gap: 5px; }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="header">
        <h1>💰 Quản Lý Chi Tiêu Cá Nhân</h1>
        <p>Theo dõi thu nhập, chi tiêu và các khoản vay nợ hằng ngày</p>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard">
        <div class="card">
            <div class="card-title">💵 Tổng thu nhập</div>
            <div class="card-value income" id="totalIncome">0 ₫</div>
        </div>
        <div class="card">
            <div class="card-title">💸 Tổng chi tiêu</div>
            <div class="card-value expense" id="totalExpense">0 ₫</div>
        </div>
        <div class="card">
            <div class="card-title">💰 Số dư</div>
            <div class="card-value balance" id="balance">0 ₫</div>
        </div>
    </div>

    <div class="main-grid">
        <!-- CỘT TRÁI: FORM NHẬP LIỆU -->
        <div>
            <!-- FORM CHI TIÊU -->
            <div class="section">
                <h2>➕ Thêm giao dịch</h2>
                <div class="form-group">
                    <label>Loại giao dịch</label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" name="type" id="expense" value="expense" checked>
                            <label for="expense">💸 Chi tiêu</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="type" id="income" value="income">
                            <label for="income">💵 Thu nhập</label>
                        </div>
                    </div>
                </div>
                <div class="form-group"><label for="amount">Số tiền</label><input type="number" id="amount" placeholder="Ví dụ: 50000" min="0"></div>
                <div class="form-group">
                    <label for="category">Danh mục</label>
                    <select id="category">
                        <option value="Ăn uống">🍜 Ăn uống</option>
                        <option value="Đi lại">🛵 Đi lại</option>
                        <option value="Mua sắm">🛒 Mua sắm</option>
                        <option value="Học tập">📚 Học tập</option>
                        <option value="Giải trí">🎮 Giải trí</option>
                        <option value="Hóa đơn">🧾 Hóa đơn</option>
                        <option value="Lương">💰 Lương</option>
                        <option value="Khác">📦 Khác</option>
                    </select>
                </div>
                <div class="form-group"><label for="date">Ngày</label><input type="date" id="date"></div>
                <div class="form-group"><label for="note">Ghi chú</label><input type="text" id="note" placeholder="Ví dụ: Ăn trưa..."></div>
                <button type="button" class="btn-add" id="btn-add-tx">+ Thêm giao dịch</button>
            </div>

            <!-- FORM NỢ MỚI -->
            <div class="section" style="border: 2px solid #fef3c7;">
                <h2>🤝 Quản lý Nợ</h2>
                <div class="form-group">
                    <label>Loại nợ</label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" name="debtType" id="borrow" value="borrow" checked>
                            <label for="borrow">📥 Mình đi vay</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" name="debtType" id="lend" value="lend">
                            <label for="lend">📤 Cho mượn</label>
                        </div>
                    </div>
                </div>
                <div class="form-group"><label for="debtPerson">Tên người vay / cho vay</label><input type="text" id="debtPerson" placeholder="Ví dụ: Nguyễn Văn A"></div>
                <div class="form-group"><label for="debtAmount">Số tiền</label><input type="number" id="debtAmount" placeholder="Ví dụ: 500000" min="0"></div>
                <div class="form-group"><label for="debtDate">Ngày ghi nợ</label><input type="date" id="debtDate"></div>
                <div class="form-group"><label for="debtNote">Ghi chú thêm</label><input type="text" id="debtNote" placeholder="Ví dụ: Hẹn tháng sau trả..."></div>
                <button type="button" class="btn-debt" id="btn-add-debt">+ Thêm khoản nợ</button>
            </div>

            <!-- CHART -->
            <div class="section">
                <h2>📊 Thống kê chi tiêu</h2>
                <div class="chart-container"><canvas id="expenseChart"></canvas></div>
            </div>
        </div>

        <!-- CỘT PHẢI: LỊCH SỬ -->
        <div>
            <!-- LỊCH SỬ CHI TIÊU -->
            <div class="section">
                <h2>📋 Lịch sử giao dịch</h2>
                <div class="filter">
                    <input type="date" id="filterDate">
                    <select id="filterCategory">
                        <option value="all">Tất cả danh mục</option>
                        <option value="Ăn uống">🍜 Ăn uống</option>
                        <option value="Đi lại">🛵 Đi lại</option>
                        <option value="Mua sắm">🛒 Mua sắm</option>
                        <option value="Học tập">📚 Học tập</option>
                        <option value="Giải trí">🎮 Giải trí</option>
                        <option value="Hóa đơn">🧾 Hóa đơn</option>
                        <option value="Lương">💰 Lương</option>
                        <option value="Khác">📦 Khác</option>
                    </select>
                    <button type="button" id="btn-clear-filter" style="background:#e5e7eb;">Xóa lọc</button>
                </div>
                <div id="transactionList"><div class="empty">Chưa có giao dịch nào</div></div>
            </div>

            <!-- LỊCH SỬ NỢ -->
            <div class="section">
                <h2>📒 Danh sách các khoản Nợ</h2>
                <div id="debtList"><div class="empty">Chưa có khoản nợ nào</div></div>
            </div>
        </div>
    </div>
</div>

<!-- FIREBASE CLIENT-SIDE DIRECT INTEGRATION -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB8WvfnEI-s9hdUpMvDSulzD5_BfJtAE48",
        authDomain: "quan-li-chi-tieu-e82b1.firebaseapp.com",
        projectId: "quan-li-chi-tieu-e82b1",
        storageBucket: "quan-li-chi-tieu-e82b1.firebasestorage.app",
        messagingSenderId: "905488417584",
        appId: "1:905488417584:web:323d109f25145ad6bc3ef5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let transactions = [];
    let debts = [];
    let expenseChart = null;

    const today = new Date().toISOString().split("T")[0];
    document.getElementById("date").value = today;
    document.getElementById("debtDate").value = today;

    const formatMoney = (num) => new Intl.NumberFormat("vi-VN", { style: "currency", currency: "VND" }).format(Number(num) || 0);
    const escapeHTML = (str) => String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    const formatDate = (d) => {
        if (!d) return "";
        const parts = d.split("-");
        return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : d;
    };

    const categoryIcons = {
        "Ăn uống": "🍜", "Đi lại": "🛵", "Mua sắm": "🛒", "Học tập": "📚",
        "Giải trí": "🎮", "Hóa đơn": "🧾", "Lương": "💰", "Khác": "📦"
    };

    async function loadAllData() {
        try {
            const [txSnap, debtSnap] = await Promise.all([
                getDocs(collection(db, "transactions")),
                getDocs(collection(db, "debts"))
            ]);

            transactions = txSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            debts = debtSnap.docs.map(d => ({ id: d.id, ...d.data() }));

            renderTransactions();
            renderDebts();
            updateDashboard();
            updateChart();
        } catch (err) {
            console.error("Firestore error:", err);
            alert("Lỗi kết nối Firestore: " + err.message);
        }
    }

    async function addTransaction() {
        const type = document.querySelector('input[name="type"]:checked').value;
        const amount = Number(document.getElementById("amount").value);
        const category = document.getElementById("category").value;
        const date = document.getElementById("date").value;
        const note = document.getElementById("note").value.trim();

        if (!amount || amount <= 0) return alert("Vui lòng nhập số tiền hợp lệ!");
        if (!date) return alert("Vui lòng chọn ngày!");

        const btn = document.getElementById("btn-add-tx");
        btn.disabled = true;

        try {
            await addDoc(collection(db, "transactions"), {
                type, amount, category, date, note: note || "Không có ghi chú", createdAt: new Date().toISOString()
            });
            document.getElementById("amount").value = "";
            document.getElementById("note").value = "";
            await loadAllData();
        } catch (err) {
            alert("Lỗi thêm: " + err.message);
        } finally {
            btn.disabled = false;
        }
    }

    async function deleteTransaction(id) {
        if (!confirm("Bạn có chắc muốn xóa giao dịch này?")) return;
        try {
            await deleteDoc(doc(db, "transactions", id));
            await loadAllData();
        } catch (err) {
            alert("Lỗi xóa: " + err.message);
        }
    }

    function renderTransactions() {
        const list = document.getElementById("transactionList");
        const filterDate = document.getElementById("filterDate").value;
        const filterCategory = document.getElementById("filterCategory").value;

        let filtered = [...transactions];
        if (filterDate) filtered = filtered.filter(t => t.date === filterDate);
        if (filterCategory !== "all") filtered = filtered.filter(t => t.category === filterCategory);

        filtered.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

        if (filtered.length === 0) {
            list.innerHTML = `<div class="empty">Không tìm thấy giao dịch</div>`;
            return;
        }

        list.innerHTML = filtered.map(t => `
            <div class="transaction">
                <div class="transaction-left">
                    <div class="icon">${categoryIcons[t.category] || "📦"}</div>
                    <div class="transaction-info">
                        <h3>${escapeHTML(t.category)}</h3>
                        <p>${escapeHTML(t.note)}</p>
                        <p>${formatDate(t.date)}</p>
                    </div>
                </div>
                <div class="transaction-right">
                    <div class="amount ${t.type}">${t.type === "income" ? "+" : "-"}${formatMoney(t.amount)}</div>
                    <button class="delete-btn" data-action="delete-tx" data-id="${t.id}">Xóa</button>
                </div>
            </div>
        `).join("");
    }

    async function addDebt() {
        const type = document.querySelector('input[name="debtType"]:checked').value;
        const person = document.getElementById("debtPerson").value.trim();
        const amount = Number(document.getElementById("debtAmount").value);
        const date = document.getElementById("debtDate").value;
        const note = document.getElementById("debtNote").value.trim();

        if (!person || !amount || amount <= 0 || !date) {
            return alert("Vui lòng nhập đầy đủ Tên, Số tiền và Ngày hợp lệ!");
        }

        const btn = document.getElementById("btn-add-debt");
        btn.disabled = true;

        try {
            await addDoc(collection(db, "debts"), {
                type, person, amount, date, note: note || "Không có ghi chú", status: "pending", createdAt: new Date().toISOString()
            });
            document.getElementById("debtPerson").value = "";
            document.getElementById("debtAmount").value = "";
            document.getElementById("debtNote").value = "";
            await loadAllData();
        } catch (err) {
            alert("Lỗi thêm nợ: " + err.message);
        } finally {
            btn.disabled = false;
        }
    }

    async function payDebt(id) {
        if (!confirm("Xác nhận đã thanh toán/nhận tiền khoản nợ này?")) return;
        try {
            await updateDoc(doc(db, "debts", id), { status: "paid", paidAt: new Date().toISOString() });
            await loadAllData();
        } catch (err) {
            alert("Lỗi cập nhật: " + err.message);
        }
    }

    async function deleteDebt(id) {
        if (!confirm("Bạn có chắc muốn xóa bản ghi nợ này?")) return;
        try {
            await deleteDoc(doc(db, "debts", id));
            await loadAllData();
        } catch (err) {
            alert("Lỗi xóa nợ: " + err.message);
        }
    }

    function renderDebts() {
        const list = document.getElementById("debtList");
        let sorted = [...debts].sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

        if (sorted.length === 0) {
            list.innerHTML = `<div class="empty">Chưa có khoản nợ nào</div>`;
            return;
        }

        list.innerHTML = sorted.map(d => {
            const isPaid = d.status === "paid";
            const typeText = d.type === "borrow" ? "Đi vay" : "Cho mượn";
            const typeBg = d.type === "borrow" ? "#dc2626" : "#16a34a";
            
            return `
            <div class="transaction" style="${isPaid ? 'opacity: 0.5;' : ''}">
                <div class="transaction-left">
                    <div class="icon" style="background: ${isPaid ? '#e5e7eb' : '#fef3c7'};">🤝</div>
                    <div class="transaction-info">
                        <h3 style="display: flex; align-items: center;">
                            ${escapeHTML(d.person)} 
                            <span style="font-size: 10px; color: white; background: ${typeBg}; padding: 2px 6px; border-radius: 4px; margin-left: 6px;">${typeText}</span>
                        </h3>
                        <p>${escapeHTML(d.note)} | Ngày tạo: ${formatDate(d.date)}</p>
                        ${isPaid ? `<p style="color: #16a34a; font-weight: bold; margin-top:2px;">✔ Đã thanh toán</p>` : `<p style="color: #f59e0b; font-weight: bold; margin-top:2px;">⏳ Chưa thanh toán</p>`}
                    </div>
                </div>
                <div class="transaction-right">
                    <div class="amount" style="color: #374151;">${formatMoney(d.amount)}</div>
                    <div style="display: flex; gap: 5px;">
                        ${!isPaid ? `<button type="button" class="pay-btn" data-action="pay-debt" data-id="${d.id}">Đã trả</button>` : ''}
                        <button type="button" class="delete-btn" data-action="delete-debt" data-id="${d.id}">Xóa</button>
                    </div>
                </div>
            </div>
            `;
        }).join("");
    }

    function updateDashboard() {
        let totalIncome = 0;
        let totalExpense = 0;

        transactions.forEach(t => {
            const amt = Number(t.amount) || 0;
            if (t.type === "income") totalIncome += amt;
            if (t.type === "expense") totalExpense += amt;
        });

        document.getElementById("totalIncome").textContent = formatMoney(totalIncome);
        document.getElementById("totalExpense").textContent = formatMoney(totalExpense);
        document.getElementById("balance").textContent = formatMoney(totalIncome - totalExpense);
    }

    function updateChart() {
        const catTotals = {};
        transactions.forEach(t => {
            if (t.type === "expense") {
                catTotals[t.category] = (catTotals[t.category] || 0) + Number(t.amount);
            }
        });

        const labels = Object.keys(catTotals);
        const data = Object.values(catTotals);
        const ctx = document.getElementById("expenseChart").getContext("2d");

        if (expenseChart) expenseChart.destroy();
        if (labels.length === 0) return;

        expenseChart = new Chart(ctx, {
            type: "doughnut",
            data: { labels, datasets: [{ data, borderWidth: 1 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom" } } }
        });
    }

    // Event Listeners
    document.getElementById("btn-add-tx").addEventListener("click", addTransaction);
    document.getElementById("btn-add-debt").addEventListener("click", addDebt);

    document.getElementById("filterDate").addEventListener("change", renderTransactions);
    document.getElementById("filterCategory").addEventListener("change", renderTransactions);
    document.getElementById("btn-clear-filter").addEventListener("click", () => {
        document.getElementById("filterDate").value = "";
        document.getElementById("filterCategory").value = "all";
        renderTransactions();
    });

    document.getElementById("transactionList").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-action='delete-tx']");
        if (btn) deleteTransaction(btn.dataset.id);
    });

    document.getElementById("debtList").addEventListener("click", (e) => {
        const payBtn = e.target.closest("button[data-action='pay-debt']");
        const delBtn = e.target.closest("button[data-action='delete-debt']");
        if (payBtn) payDebt(payBtn.dataset.id);
        if (delBtn) deleteDebt(delBtn.dataset.id);
    });

    loadAllData();
</script>

</body>
</html>
