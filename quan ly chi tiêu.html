<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Chi Tiêu Cá Nhân</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #1f2937;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .header {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
        }

        /* DASHBOARD */

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.06);
        }

        .card-title {
            font-size: 15px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 27px;
            font-weight: bold;
        }

        .income {
            color: #16a34a;
        }

        .expense {
            color: #dc2626;
        }

        .balance {
            color: #2563eb;
        }

        /* MAIN GRID */

        .main-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 25px;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }

        .section h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        .radio-group {
            display: flex;
            gap: 10px;
        }

        .radio-option {
            flex: 1;
        }

        .radio-option input {
            display: none;
        }

        .radio-option label {
            display: block;
            text-align: center;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            cursor: pointer;
        }

        .radio-option input:checked + label {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-add {
            width: 100%;
            background: #2563eb;
            color: white;
        }

        .btn-add:hover {
            background: #1d4ed8;
        }

        /* FILTER */

        .filter {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        /* TRANSACTIONS */

        .transaction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .transaction:last-child {
            border-bottom: none;
        }

        .transaction-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eff6ff;
            font-size: 20px;
        }

        .transaction-info h3 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .transaction-info p {
            color: #6b7280;
            font-size: 12px;
        }

        .transaction-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .amount {
            font-weight: bold;
        }

        .amount.expense {
            color: #dc2626;
        }

        .amount.income {
            color: #16a34a;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
            padding: 7px 10px;
            font-size: 12px;
        }

        .empty {
            text-align: center;
            color: #9ca3af;
            padding: 30px;
        }

        /* CHART */

        .chart-container {
            position: relative;
            height: 300px;
        }

        /* RESPONSIVE */

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 650px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .filter {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 24px;
            }

            .transaction-right {
                flex-direction: column;
                align-items: flex-end;
                gap: 5px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">
        <h1>💰 Quản Lý Chi Tiêu Cá Nhân</h1>
        <p>Theo dõi thu nhập và chi tiêu hằng ngày</p>
    </div>


    <!-- DASHBOARD -->

    <div class="dashboard">

        <div class="card">
            <div class="card-title">💵 Tổng thu nhập</div>
            <div class="card-value income" id="totalIncome">
                0 ₫
            </div>
        </div>

        <div class="card">
            <div class="card-title">💸 Tổng chi tiêu</div>
            <div class="card-value expense" id="totalExpense">
                0 ₫
            </div>
        </div>

        <div class="card">
            <div class="card-title">💰 Số dư</div>
            <div class="card-value balance" id="balance">
                0 ₫
            </div>
        </div>

    </div>


    <div class="main-grid">

        <!-- LEFT -->

        <div>

            <!-- ADD TRANSACTION -->

            <div class="section">

                <h2>➕ Thêm giao dịch</h2>

                <div class="form-group">

                    <label>Loại giao dịch</label>

                    <div class="radio-group">

                        <div class="radio-option">
                            <input
                                type="radio"
                                name="type"
                                id="expense"
                                value="expense"
                                checked
                            >
                            <label for="expense">
                                💸 Chi tiêu
                            </label>
                        </div>

                        <div class="radio-option">
                            <input
                                type="radio"
                                name="type"
                                id="income"
                                value="income"
                            >
                            <label for="income">
                                💵 Thu nhập
                            </label>
                        </div>

                    </div>

                </div>


                <div class="form-group">

                    <label for="amount">
                        Số tiền
                    </label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Ví dụ: 50000"
                        min="0"
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Danh mục
                    </label>

                    <select id="category">

                        <option value="Ăn uống">
                            🍜 Ăn uống
                        </option>

                        <option value="Đi lại">
                            🛵 Đi lại
                        </option>

                        <option value="Mua sắm">
                            🛒 Mua sắm
                        </option>

                        <option value="Học tập">
                            📚 Học tập
                        </option>

                        <option value="Giải trí">
                            🎮 Giải trí
                        </option>

                        <option value="Hóa đơn">
                            🧾 Hóa đơn
                        </option>

                        <option value="Lương">
                            💰 Lương
                        </option>

                        <option value="Khác">
                            📦 Khác
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="date">
                        Ngày
                    </label>

                    <input
                        type="date"
                        id="date"
                    >

                </div>


                <div class="form-group">

                    <label for="note">
                        Ghi chú
                    </label>

                    <input
                        type="text"
                        id="note"
                        placeholder="Ví dụ: Ăn trưa..."
                    >

                </div>


                <button
                    class="btn-add"
                    onclick="addTransaction()"
                >
                    + Thêm giao dịch
                </button>

            </div>


            <!-- CHART -->

            <div class="section">

                <h2>📊 Thống kê chi tiêu</h2>

                <div class="chart-container">
                    <canvas id="expenseChart"></canvas>
                </div>

            </div>

        </div>


        <!-- RIGHT -->

        <div>

            <div class="section">

                <h2>📋 Lịch sử giao dịch</h2>


                <!-- FILTER -->

                <div class="filter">

                    <input
                        type="date"
                        id="filterDate"
                        onchange="renderTransactions()"
                    >

                    <select
                        id="filterCategory"
                        onchange="renderTransactions()"
                    >

                        <option value="all">
                            Tất cả danh mục
                        </option>

                        <option value="Ăn uống">
                            🍜 Ăn uống
                        </option>

                        <option value="Đi lại">
                            🛵 Đi lại
                        </option>

                        <option value="Mua sắm">
                            🛒 Mua sắm
                        </option>

                        <option value="Học tập">
                            📚 Học tập
                        </option>

                        <option value="Giải trí">
                            🎮 Giải trí
                        </option>

                        <option value="Hóa đơn">
                            🧾 Hóa đơn
                        </option>

                        <option value="Lương">
                            💰 Lương
                        </option>

                        <option value="Khác">
                            📦 Khác
                        </option>

                    </select>

                    <button
                        onclick="clearFilter()"
                        style="background:#e5e7eb;"
                    >
                        Xóa lọc
                    </button>

                </div>


                <!-- TRANSACTION LIST -->

                <div id="transactionList">

                    <div class="empty">
                        Chưa có giao dịch nào
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

    // =====================================
    // DATA
    // =====================================

    let transactions =
        JSON.parse(localStorage.getItem("transactions")) || [];


    // =====================================
    // DEFAULT DATE
    // =====================================

    document.getElementById("date").value =
        new Date().toISOString().split("T")[0];


    // =====================================
    // FORMAT MONEY
    // =====================================

    function formatMoney(number) {

        return new Intl.NumberFormat("vi-VN", {
            style: "currency",
            currency: "VND"
        }).format(number);

    }


    // =====================================
    // ADD TRANSACTION
    // =====================================

    function addTransaction() {

        const type =
            document.querySelector(
                'input[name="type"]:checked'
            ).value;

        const amount =
            Number(document.getElementById("amount").value);

        const category =
            document.getElementById("category").value;

        const date =
            document.getElementById("date").value;

        const note =
            document.getElementById("note").value.trim();


        // CHECK

        if (!amount || amount <= 0) {

            alert("Vui lòng nhập số tiền hợp lệ!");

            return;
        }


        if (!date) {

            alert("Vui lòng chọn ngày!");

            return;
        }


        // CREATE OBJECT

        const transaction = {

            id: Date.now(),

            type: type,

            amount: amount,

            category: category,

            date: date,

            note: note || "Không có ghi chú"

        };


        // ADD

        transactions.push(transaction);


        // SAVE

        saveData();


        // RESET

        document.getElementById("amount").value = "";

        document.getElementById("note").value = "";


        // UPDATE

        renderTransactions();

        updateDashboard();

        updateChart();

    }


    // =====================================
    // SAVE DATA
    // =====================================

    function saveData() {

        localStorage.setItem(
            "transactions",
            JSON.stringify(transactions)
        );

    }


    // =====================================
    // DELETE
    // =====================================

    function deleteTransaction(id) {

        if (!confirm("Bạn có chắc muốn xóa giao dịch này?")) {

            return;

        }


        transactions =
            transactions.filter(
                transaction => transaction.id !== id
            );


        saveData();

        renderTransactions();

        updateDashboard();

        updateChart();

    }


    // =====================================
    // ICON
    // =====================================

    function getIcon(category) {

        const icons = {

            "Ăn uống": "🍜",

            "Đi lại": "🛵",

            "Mua sắm": "🛒",

            "Học tập": "📚",

            "Giải trí": "🎮",

            "Hóa đơn": "🧾",

            "Lương": "💰",

            "Khác": "📦"

        };

        return icons[category] || "📦";

    }


    // =====================================
    // RENDER TRANSACTIONS
    // =====================================

    function renderTransactions() {

        const list =
            document.getElementById("transactionList");


        const filterDate =
            document.getElementById("filterDate").value;


        const filterCategory =
            document.getElementById("filterCategory").value;


        let filtered =
            [...transactions];


        // FILTER DATE

        if (filterDate) {

            filtered =
                filtered.filter(
                    transaction =>
                        transaction.date === filterDate
                );

        }


        // FILTER CATEGORY

        if (filterCategory !== "all") {

            filtered =
                filtered.filter(
                    transaction =>
                        transaction.category === filterCategory
                );

        }


        // SORT NEWEST

        filtered.sort(
            (a, b) =>
                new Date(b.date) - new Date(a.date)
        );


        // EMPTY

        if (filtered.length === 0) {

            list.innerHTML = `
                <div class="empty">
                    Không tìm thấy giao dịch
                </div>
            `;

            return;

        }


        // RENDER

        list.innerHTML =
            filtered.map(transaction => {

                const sign =
                    transaction.type === "income"
                        ? "+"
                        : "-";


                const amountClass =
                    transaction.type;


                return `

                    <div class="transaction">

                        <div class="transaction-left">

                            <div class="icon">
                                ${getIcon(transaction.category)}
                            </div>

                            <div class="transaction-info">

                                <h3>
                                    ${transaction.category}
                                </h3>

                                <p>
                                    ${transaction.note}
                                </p>

                                <p>
                                    ${formatDate(transaction.date)}
                                </p>

                            </div>

                        </div>


                        <div class="transaction-right">

                            <div
                                class="amount ${amountClass}"
                            >
                                ${sign}
                                ${formatMoney(transaction.amount)}
                            </div>

                            <button
                                class="delete-btn"
                                onclick="deleteTransaction(${transaction.id})"
                            >
                                Xóa
                            </button>

                        </div>

                    </div>

                `;

            }).join("");

    }


    // =====================================
    // FORMAT DATE
    // =====================================

    function formatDate(date) {

        const d =
            new Date(date + "T00:00:00");

        return d.toLocaleDateString("vi-VN");

    }


    // =====================================
    // DASHBOARD
    // =====================================

    function updateDashboard() {

        let income = 0;

        let expense = 0;


        transactions.forEach(transaction => {

            if (transaction.type === "income") {

                income += transaction.amount;

            } else {

                expense += transaction.amount;

            }

        });


        const balance =
            income - expense;


        document.getElementById("totalIncome")
            .textContent =
            formatMoney(income);


        document.getElementById("totalExpense")
            .textContent =
            formatMoney(expense);


        document.getElementById("balance")
            .textContent =
            formatMoney(balance);

    }


    // =====================================
    // CLEAR FILTER
    // =====================================

    function clearFilter() {

        document.getElementById("filterDate").value = "";

        document.getElementById("filterCategory").value = "all";

        renderTransactions();

    }


    // =====================================
    // CHART
    // =====================================

    let expenseChart;


    function updateChart() {

        const categories = {

            "Ăn uống": 0,

            "Đi lại": 0,

            "Mua sắm": 0,

            "Học tập": 0,

            "Giải trí": 0,

            "Hóa đơn": 0,

            "Khác": 0

        };


        transactions.forEach(transaction => {

            if (
                transaction.type === "expense"
                &&
                categories.hasOwnProperty(
                    transaction.category
                )
            ) {

                categories[
                    transaction.category
                ] += transaction.amount;

            }

        });


        const labels =
            Object.keys(categories);


        const data =
            Object.values(categories);


        const ctx =
            document
                .getElementById("expenseChart")
                .getContext("2d");


        if (expenseChart) {

            expenseChart.destroy();

        }


        expenseChart =
            new Chart(ctx, {

                type: "doughnut",

                data: {

                    labels: labels,

                    datasets: [{

                        data: data,

                        borderWidth: 1

                    }]

                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    plugins: {

                        legend: {

                            position: "bottom"

                        }

                    }

                }

            });

    }


    // =====================================
    // INITIALIZE
    // =====================================

    renderTransactions();

    updateDashboard();

    updateChart();

</script>

</body>
</html>
